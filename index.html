<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CewekPedia ❤️ Musik & Chat Bareng</title>
  <meta name="description" content="Dengarkan musik dan ngobrol bareng komunitas CewekPedia.">
  <link rel="canonical" href="https://cewekpedia.com/">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F9LX0ZNCJ7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F9LX0ZNCJ7');
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    body {
      min-height: 100dvh;
    }

    .page {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 12px;
    }

    .brand {
      text-align: center;
      padding: 8px 4px 14px;
    }

    .brand h1 {
      margin: 0;
      color: #d93672;
      font-size: clamp(22px, 5vw, 30px);
    }

    .brand p {
      margin: 6px 0 0;
      color: #777;
      font-size: 13px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 17px;
      color: #c72d68;
    }

    .music-card,
    .chat-card {
      background: #fff;
      border: 1px solid #f0d5e1;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(190, 55, 112, .07);
    }

    .music-frame {
      display: block;
      width: 100%;
      height: 225px;
      border: 0;
      border-radius: 10px;
      background: #fff0f6;
    }

    .chat-card {
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }

    .chat-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chat-heading .section-title {
      margin: 0;
    }

    .status {
      color: #777;
      font-size: 12px;
    }

    .status.online {
      color: #18864b;
    }

    .name-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input, textarea, button {
      font: inherit;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #e8cbd8;
      border-radius: 10px;
      padding: 11px;
      outline: none;
      background: #fff;
      color: #333;
    }

    input:focus, textarea:focus {
      border-color: #ed6b9e;
    }

    .name-row input {
      min-width: 0;
    }

    .name-row button,
    .send-button {
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #e83e83;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .messages {
      flex: 1;
      min-height: 210px;
      max-height: 42vh;
      overflow-y: auto;
      padding: 10px;
      border-radius: 12px;
      background: #fff8fb;
      border: 1px solid #f5e2eb;
    }

    .empty-message {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 24px 8px;
    }

    .message {
      padding: 9px 10px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #f2dce6;
      overflow-wrap: anywhere;
    }

    .message:last-child {
      margin-bottom: 0;
    }

    .message-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .message-name {
      color: #c72d68;
      font-weight: bold;
      font-size: 13px;
    }

    .message-time {
      color: #999;
      font-size: 10px;
      flex-shrink: 0;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .composer {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      margin-top: 10px;
    }

    .composer textarea {
      resize: vertical;
      min-height: 44px;
      max-height: 120px;
    }

    .send-button {
      min-height: 44px;
    }

    .notice {
      min-height: 17px;
      margin: 8px 2px 0;
      color: #777;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      padding: 2px 8px 12px;
      color: #999;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 8px;
      }

      .music-card, .chat-card {
        padding: 10px;
        border-radius: 13px;
      }

      .music-frame {
        height: 220px;
      }

      .chat-card {
        min-height: 430px;
      }

      .messages {
        max-height: 38vh;
      }

      .name-row button,
      .send-button {
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="brand">
      <h1>CewekPedia ❤️</h1>
      <p>Dengerin musik, ngobrol, dan temukan teman baru.</p>
    </header>

    <!-- MUSIC PLAYER: FILE INI TIDAK PERLU DIUBAH -->
    <section class="music-card">
      <h2 class="section-title">🎵 Music Player</h2>

      <iframe
        class="music-frame"
        src="music-player.html"
        title="CewekPedia Music Player"
        loading="eager"
        allow="autoplay"
      ></iframe>
    </section>

    <!-- CHAT UMUM -->
    <section class="chat-card">
      <div class="chat-heading">
        <h2 class="section-title">💬 Chat Bareng</h2>
        <span id="chatStatus" class="status">Menghubungkan...</span>
      </div>

      <div class="name-row">
        <input
          id="nickname"
          type="text"
          maxlength="20"
          placeholder="Nama panggilan"
          autocomplete="nickname"
          aria-label="Nama panggilan"
        >
        <button id="saveName" type="button">Simpan</button>
      </div>

      <div
        id="messages"
        class="messages"
        role="log"
        aria-live="polite"
        aria-label="Pesan chat"
      >
        <div class="empty-message">Menghubungkan ke chat...</div>
      </div>

      <form id="chatForm" class="composer">
        <textarea
          id="messageInput"
          maxlength="300"
          rows="2"
          placeholder="Tulis pesan..."
          aria-label="Tulis pesan"
          required
        ></textarea>
        <button id="sendButton" class="send-button" type="submit">
          Kirim
        </button>
      </form>

      <p id="notice" class="notice">
        Gunakan bahasa yang sopan dan jangan bagikan data pribadi.
      </p>
    </section>

    <footer class="footer">
      CewekPedia ❤️ Musik & Chat Bareng
    </footer>

  </main>

  <!-- FIREBASE CHAT -->
  <script type="module">
    import {
      initializeApp,
      getApp,
      getApps
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      onValue,
      query,
      limitToLast,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCnhVGlnGKoqddyLvOgE7t4MGG926iQ8O0",
      authDomain: "ruang-cewek.firebaseapp.com",
      databaseURL: "https://ruang-cewek-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ruang-cewek",
      storageBucket: "ruang-cewek.firebasestorage.app",
      messagingSenderId: "300030693884",
      appId: "1:300030693884:web:ec02ce2cf35646dbf3a279"
    };

    const nicknameInput = document.getElementById("nickname");
    const saveNameButton = document.getElementById("saveName");
    const messageInput = document.getElementById("messageInput");
    const chatForm = document.getElementById("chatForm");
    const sendButton = document.getElementById("sendButton");
    const messagesBox = document.getElementById("messages");
    const chatStatus = document.getElementById("chatStatus");
    const notice = document.getElementById("notice");

    let currentUser = null;
    let messagesPathRef = null;
    let sending = false;

    try {
      nicknameInput.value =
        localStorage.getItem("cewekpedia_chat_name") || "";
    } catch (error) {
      console.warn("Penyimpanan nama tidak tersedia:", error);
    }

    function setNotice(message) {
      notice.textContent = message;
    }

    function setStatus(message, online = false) {
      chatStatus.textContent = message;
      chatStatus.classList.toggle("online", online);
    }

    saveNameButton.addEventListener("click", () => {
      const name = nicknameInput.value.trim().slice(0, 20);

      if (!name) {
        setNotice("Isi nama panggilan terlebih dahulu.");
        nicknameInput.focus();
        return;
      }

      nicknameInput.value = name;

      try {
        localStorage.setItem("cewekpedia_chat_name", name);
      } catch (error) {
        console.warn("Nama tidak dapat disimpan:", error);
      }

      setNotice("Nama panggilan disimpan.");
    });

    function formatTime(value) {
      if (typeof value !== "number") return "";

      return new Date(value).toLocaleTimeString("id-ID", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderMessages(snapshot) {
      messagesBox.replaceChildren();

      if (!snapshot.exists()) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent =
          "Belum ada pesan. Jadilah yang pertama menyapa! ❤️";
        messagesBox.appendChild(empty);
        return;
      }

      snapshot.forEach((child) => {
        const item = child.val();

        const message = document.createElement("article");
        message.className = "message";

        const top = document.createElement("div");
        top.className = "message-top";

        const name = document.createElement("span");
        name.className = "message-name";
        name.textContent =
          typeof item.nickname === "string"
            ? item.nickname
            : "Pengunjung";

        const time = document.createElement("span");
        time.className = "message-time";
        time.textContent = formatTime(item.timestamp);

        const body = document.createElement("div");
        body.className = "message-text";
        body.textContent =
          typeof item.text === "string" ? item.text : "";

        top.append(name, time);
        message.append(top, body);
        messagesBox.appendChild(message);
      });

      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const nickname = nicknameInput.value.trim().slice(0, 20);
      const messageText = messageInput.value.trim().slice(0, 300);

      if (!nickname) {
        setNotice("Isi nama panggilan sebelum mengirim pesan.");
        nicknameInput.focus();
        return;
      }

      if (!messageText) return;

      if (!currentUser || !messagesPathRef) {
        setNotice("Chat belum siap. Tunggu sebentar lalu coba lagi.");
        return;
      }

      if (sending) return;

      sending = true;
      sendButton.disabled = true;
      setNotice("Mengirim pesan...");

      try {
        try {
          localStorage.setItem("cewekpedia_chat_name", nickname);
        } catch (error) {
          console.warn("Nama tidak dapat disimpan:", error);
        }

        // Gunakan referensi database langsung untuk push().
        await set(push(messagesPathRef), {
          nickname: nickname,
          text: messageText,
          uid: currentUser.uid,
          timestamp: serverTimestamp()
        });

        messageInput.value = "";
        setNotice("Pesan terkirim.");
        messageInput.focus();

      } catch (error) {
        console.error("Gagal mengirim pesan:", error);

        if (error.code === "PERMISSION_DENIED" ||
            error.code === "permission-denied") {
          setNotice(
            "Firebase menolak pesan. Periksa Rules publicChat/messages."
          );
        } else if (error.code === "NETWORK_ERROR") {
          setNotice("Koneksi bermasalah. Coba kirim kembali.");
        } else {
          setNotice(
            "Pesan gagal dikirim. Periksa koneksi dan Firebase."
          );
        }

      } finally {
        sending = false;
        sendButton.disabled = false;
      }
    });

    async function startChat() {
      try {
        const app = getApps().length
          ? getApp()
          : initializeApp(firebaseConfig);

        const auth = getAuth(app);
        const db = getDatabase(app);

        // Referensi untuk menulis pesan.
        messagesPathRef = ref(db, "publicChat/messages");

        // Login anonim harus berhasil sebelum membaca atau mengirim pesan.
        setStatus("Login ke chat...");

        const credential = await signInAnonymously(auth);
        currentUser = credential.user;

        if (!currentUser) {
          throw new Error("Login anonim belum berhasil.");
        }

        setStatus("Terhubung", true);
        setNotice(
          "Terhubung ke chat. Gunakan bahasa yang sopan."
        );

        // Query hanya digunakan untuk membaca 100 pesan terakhir.
        const messagesQuery = query(
          messagesPathRef,
          limitToLast(100)
        );

        onValue(
          messagesQuery,
          renderMessages,
          (error) => {
            console.error("Gagal membaca chat:", error);
            setStatus("Chat bermasalah");
            setNotice(
              "Pesan tidak dapat dimuat. Periksa Rules Firebase."
            );
          }
        );

      } catch (error) {
        console.error("Firebase Chat Error:", error);
        currentUser = null;
        setStatus("Belum terhubung");

        if (
          error.code === "auth/operation-not-allowed"
        ) {
          setNotice(
            "Login anonim belum aktif. Aktifkan Anonymous di Firebase Authentication."
          );
        } else if (
          error.code === "auth/unauthorized-domain"
        ) {
          setNotice(
            "Domain belum diizinkan. Periksa Authorized domains di Firebase Authentication."
          );
        } else {
          setNotice(
            "Chat gagal terhubung. Periksa koneksi, konfigurasi, dan Firebase Authentication."
          );
        }
      }
    }

    startChat();
  </script>
</body>
</html>
