<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MAUNYA WANITA ❤️❤️ — CewekPedia</title>

<link
    rel="stylesheet"
    href="style.css"
>


<style>

/* =========================================
   DASAR
   ========================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#fff7fb;
}

.shell{

    position:relative;

    width:100%;
    min-height:100vh;

    background:#fff7fb;
}


/* =========================================
   HEADER STICKY (MEMBUNGKUS KEDUA TOP BAR)
   ========================================= */

.sticky-header{

    position:sticky;
    top:0;

    z-index:9999;

    width:100%;

    background:#fff7fb;
}


/* =========================================
   TOP BAR 1 — KATEGORI
   ========================================= */

.category-bar{

    width:100%;

    min-height:42px;

    padding:3px 8px;

    display:flex;
    align-items:center;

    gap:5px;

    background:rgba(255,247,251,.98);

    border-bottom:1px solid #f1d2df;

    box-shadow:
        0 2px 9px rgba(217,47,114,.08);

    overflow-x:auto;

    scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
    display:none;
}


/* HOME BUTTON */

.home-button{

    flex-shrink:0;

    width:32px;
    height:32px;

    border:none;
    border-radius:50%;

    background:#fbe3ec;

    color:#d92f72;

    font-size:16px;

    cursor:pointer;
}

.home-button.active{

    background:#d92f72;

    color:white;
}


/* CATEGORY LINKS */

.category-links{

    display:flex;

    align-items:center;

    gap:4px;

    flex-shrink:0;
}

.category-links button{

    border:none;

    border-radius:17px;

    padding:6px 9px;

    background:#fbe3ec;

    color:#713b50;

    font-size:10px;

    font-weight:bold;

    white-space:nowrap;

    cursor:pointer;
}

.category-links button.active{

    background:#d92f72;

    color:white;
}

.category-links button:hover{

    background:#f4cfde;
}


/* =========================================
   TOP BAR 2 — MUSIK (TINGGI TETAP & STABIL)
   ========================================= */

.music-area{

    position:relative;

    width:100%;

    height:110px; /* Tinggi stabil untuk PC */

    padding:4px 8px;

    background:#fff7fb;

    border-bottom:1px solid #f1d2df;

    overflow:hidden;
}


/* =========================================
   PLAYER
   ========================================= */

.music-frame{

    display:block;

    width:100%;

    height:100%;

    border:none;

    border-radius:12px;

    background:transparent;
}


/* =========================================
   BADGE PEMUTAR MUSIK
   ========================================= */

.music-hint{

    display:inline-flex;

    align-items:center;

    position:absolute;

    right:10px;

    top:6px;

    z-index:10000;

    font-size:9px;

    font-weight:bold;

    color:#ffffff;

    background:#d92f72;

    padding:3px 8px;

    border-radius:12px;

    box-shadow:0 2px 5px rgba(217,47,114,.2);

    pointer-events:none;
}


/* =========================================
   CONTENT
   ========================================= */

#pageFrame{

    display:block;

    width:100%;

    height:calc(100vh - 152px);

    min-height:650px;

    border:none;

    background:#fff7fb;
}


/* =========================================
   MOBILE
   ========================================= */

@media(max-width:600px){

    /* TOP BAR 1 */

    .category-bar{

        min-height:40px;

        padding:2px 6px;

        gap:4px;
    }


    .home-button{

        width:30px;
        height:30px;

        font-size:15px;
    }


    .category-links{

        gap:3px;
    }


    .category-links button{

        padding:5px 8px;

        font-size:9px;
    }


    /* TOP BAR 2 MUSIK (HP) */

    .music-area{

        height:105px; /* Tinggi stabil untuk HP */

        padding:3px 5px;
    }


    /* BADGE MUSIK HP */

    .music-hint{

        right:8px;

        top:5px;

        font-size:8px;

        padding:2px 6px;
    }


    /* CONTENT */

    #pageFrame{

        height:calc(100vh - 145px);

        min-height:650px;
    }

}

</style>

</head>


<body>


<div class="shell">


    <!-- =====================================
         STUCK HEADER (KATEGORI + MUSIK NEMPUL BERBERSAMAAN)
         ===================================== -->

    <header class="sticky-header">


        <!-- TOP BAR 1 — KATEGORI -->
        <nav class="category-bar">


            <button
                id="homeButton"
                class="home-button active"
                onclick="goHome()"
                aria-label="Beranda"
            >
                🏠
            </button>


            <div class="category-links">


                <button
                    id="navCantik"
                    onclick="goCategory('cantik')"
                >
                    💄 Pengen Cantik
                </button>


                <button
                    id="navNikah"
                    onclick="goCategory('nikah')"
                >
                    💍 Pengen Nikah
                </button>


                <button
                    id="navMakan"
                    onclick="goCategory('makan')"
                >
                    🛍️ Makan & Belanja
                </button>


                <button
                    id="navHealing"
                    onclick="goCategory('healing')"
                >
                    🌴 Jalan-jalan / Healing
                </button>


                <button
                    id="navRuangCewek"
                    onclick="goPage('ruangcewek/index.html')"
                >
                    💬 Ruang Cewek
                </button>


                <button
                    id="navRuangLawak"
                    onclick="goPage('ruanglawak/index.html')"
                >
                    😂 Ruang Lawak
                </button>


            </div>

        </nav>


        <!-- TOP BAR 2 — MUSIK -->
        <div
            id="musicArea"
            class="music-area"
        >


            <iframe
                id="musicFrame"
                class="music-frame"
                src="music-player.html"
                title="CewekPedia Music"
                scrolling="no"
            >
            </iframe>


            <div
                id="musicHint"
                class="music-hint"
            >
                🎵 Pemutar Musik
            </div>


        </div>


    </header>


    <!-- =====================================
         ISI HALAMAN
         ===================================== -->

    <iframe
        id="pageFrame"
        src="home.html"
        title="CewekPedia Content"
    >
    </iframe>


</div>


<script>


const pageFrame =
    document.getElementById("pageFrame");


/* =========================================
   HOME
   ========================================= */

function goHome(){

    pageFrame.src="home.html";

    clearActive();

    document
        .getElementById("homeButton")
        .classList
        .add("active");

}


/* =========================================
   KATEGORI
   ========================================= */

function goCategory(category){

    localStorage.setItem(
        "mw_category",
        category
    );

    localStorage.removeItem(
        "mw_city"
    );

    localStorage.removeItem(
        "mw_subcategory"
    );


    pageFrame.src="kota.html";

    clearActive();


    if(category==="cantik"){

        document
            .getElementById("navCantik")
            .classList
            .add("active");

    }


    if(category==="nikah"){

        document
            .getElementById("navNikah")
            .classList
            .add("active");

    }


    if(category==="makan"){

        document
            .getElementById("navMakan")
            .classList
            .add("active");

    }


    if(category==="healing"){

        document
            .getElementById("navHealing")
            .classList
            .add("active");

    }

}


/* =========================================
   RUANG CEWEK / RUANG LAWAK
   ========================================= */

function goPage(url){

    pageFrame.src=url;

    clearActive();


    if(url==="ruangcewek/index.html"){

        document
            .getElementById("navRuangCewek")
            .classList
            .add("active");

    }


    if(url==="ruanglawak/index.html"){

        document
            .getElementById("navRuangLawak")
            .classList
            .add("active");

    }

}


/* =========================================
   ACTIVE MENU
   ========================================= */

function clearActive(){

    document
        .querySelectorAll(
            ".category-links button"
        )
        .forEach(function(button){

            button
                .classList
                .remove("active");

        });


    document
        .getElementById("homeButton")
        .classList
        .remove("active");

}


/* =========================================
   DETEKSI HALAMAN
   ========================================= */

pageFrame.addEventListener(
    "load",
    function(){

        let path="";


        try{

            path =
                pageFrame
                    .contentWindow
                    .location
                    .pathname;

        }catch(error){

            return;

        }


        /* HOME */

        if(
            path.endsWith("/") ||
            path.includes("home.html")
        ){

            clearActive();

            document
                .getElementById("homeButton")
                .classList
                .add("active");

            return;

        }


        /* RUANG CEWEK */

        if(
            path.includes("ruangcewek")
        ){

            clearActive();

            document
                .getElementById("navRuangCewek")
                .classList
                .add("active");

            return;

        }


        /* RUANG LAWAK */

        if(
            path.includes("ruanglawak")
        ){

            clearActive();

            document
                .getElementById("navRuangLawak")
                .classList
                .add("active");

            return;

        }


        /* HALAMAN LAIN */

        const category =
            localStorage.getItem(
                "mw_category"
            );


        clearActive();


        if(category==="cantik"){

            document
                .getElementById("navCantik")
                .classList
                .add("active");

        }


        if(category==="nikah"){

            document
                .getElementById("navNikah")
                .classList
                .add("active");

        }


        if(category==="makan"){

            document
                .getElementById("navMakan")
                .classList
                .add("active");

        }


        if(category==="healing"){

            document
                .getElementById("navHealing")
                .classList
                .add("active");

        }

    }
);

</script>


</body>

</html>
