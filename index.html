<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MAUNYA WANITA ❤️❤️ — CewekPedia</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #fff7fb;
    }


    /* =========================
       TOP NAVIGATION
    ========================= */

    .top-nav {
        position: sticky;
        top: 0;
        z-index: 9999;

        width: 100%;

        background: rgba(255, 247, 251, 0.97);

        border-bottom: 1px solid #f1d2df;

        box-shadow:
            0 2px 10px rgba(217, 47, 114, 0.08);

        padding: 8px 10px;

        display: flex;
        align-items: center;
        gap: 8px;

        overflow-x: auto;

        scrollbar-width: none;
    }

    .top-nav::-webkit-scrollbar {
        display: none;
    }


    .nav-home {
        flex-shrink: 0;

        border: none;
        background: transparent;

        color: #d92f72;

        font-size: 18px;

        cursor: pointer;

        padding: 5px 7px;
    }


    .nav-links {
        display: flex;

        align-items: center;

        gap: 5px;

        flex-shrink: 0;
    }


    .nav-links button {
        border: none;

        background: #fbe3ec;

        color: #713b50;

        border-radius: 18px;

        padding: 7px 10px;

        font-size: 11px;

        font-weight: bold;

        white-space: nowrap;

        cursor: pointer;
    }


    .nav-links button:hover {
        background: #f5cedd;
    }


    .nav-links button.active {
        background: #d92f72;

        color: white;
    }


    /* =========================
       MUSIC BAR
    ========================= */

    .music-top {
        flex: 1;

        min-width: 145px;
        max-width: 430px;

        height: 43px;

        overflow: hidden;

        border-radius: 22px;

        background: #fff;

        border: 1px solid #f0c8d8;

        box-shadow:
            0 2px 8px rgba(217, 47, 114, 0.08);
    }


    .music-top iframe {
        display: block;

        width: 100%;
        height: 43px;

        border: 0;
    }


    /* =========================
       CONTENT FRAME
    ========================= */

    #pageFrame {
        display: block;

        width: 100%;

        height: calc(100vh - 65px);

        min-height: 650px;

        border: none;

        background: #fff7fb;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        .top-nav {
            padding: 7px 6px;

            gap: 5px;
        }


        .nav-home {
            font-size: 17px;

            padding: 5px;
        }


        .nav-links {
            gap: 4px;
        }


        .nav-links button {
            font-size: 10px;

            padding: 6px 8px;
        }


        .music-top {
            min-width: 120px;

            height: 40px;

            border-radius: 20px;
        }


        .music-top iframe {
            height: 40px;
        }


        #pageFrame {
            height: calc(100vh - 55px);

            min-height: 650px;
        }

    }

</style>

</head><body><!-- =========================
     TOP BAR
========================== -->

<nav class="top-nav">


    <button
        class="nav-home active"
        id="homeButton"
        onclick="goPage('home.html')"
        aria-label="Home"
    >
        🏠
    </button>


    <div class="nav-links">


        <button
            id="navCantik"
            onclick="goCategory('cantik')"
        >
            💄 Cantik
        </button>


        <button
            id="navNikah"
            onclick="goCategory('nikah')"
        >
            💍 Nikah
        </button>


        <button
            id="navMakan"
            onclick="goCategory('makan')"
        >
            🛍️ Makan & Belanja
        </button>


        <button
            id="navHealing"
            onclick="goCategory('healing')"
        >
            🌴 Healing
        </button>


        <button
            id="navRuangCewek"
            onclick="goPage('ruangcewek/index.html')"
        >
            💬 Ruang Cewek
        </button>


        <button
            id="navRuangLawak"
            onclick="goPage('ruanglawak/index.html')"
        >
            😂 Ruang Lawak
        </button>


    </div>


    <!-- MUSIC PLAYER PERSISTENT -->

    <div class="music-top">

        <iframe
            src="music-player.html"
            title="CewekPedia Music"
            scrolling="no"
        >
        </iframe>

    </div>


</nav>


<!-- =========================
     PAGE CONTENT
========================== -->

<iframe
    id="pageFrame"
    src="home.html"
    title="CewekPedia Content"
>
</iframe>


<script>


    const pageFrame =
        document.getElementById("pageFrame");


    function goPage(url) {

        pageFrame.src = url;

        updateActiveNav(url);

    }


    function goCategory(category) {

        localStorage.setItem(
            "mw_category",
            category
        );

        localStorage.removeItem(
            "mw_city"
        );

        localStorage.removeItem(
            "mw_subcategory"
        );


        pageFrame.src = "kota.html";

        updateActiveNav(category);

    }


    function updateActiveNav(value) {

        document
            .querySelectorAll(".nav-links button")
            .forEach(function(button) {

                button.classList.remove("active");

            });


        document
            .getElementById("homeButton")
            .classList.remove("active");


        if (
            value === "home.html" ||
            value === ""
        ) {

            document
                .getElementById("homeButton")
                .classList.add("active");

            return;

        }


        if (
            value === "cantik" ||
            value === "Pengen Cantik"
        ) {

            document
                .getElementById("navCantik")
                .classList.add("active");

        }


        if (
            value === "nikah" ||
            value === "Pengen Nikah"
        ) {

            document
                .getElementById("navNikah")
                .classList.add("active");

        }


        if (
            value === "makan" ||
            value === "Pengen Makan & Belanja"
        ) {

            document
                .getElementById("navMakan")
                .classList.add("active");

        }


        if (
            value === "healing" ||
            value === "Pengen Jalan-jalan / Healing"
        ) {

            document
                .getElementById("navHealing")
                .classList.add("active");

        }


        if (
            value === "ruangcewek/index.html"
        ) {

            document
                .getElementById("navRuangCewek")
                .classList.add("active");

        }


        if (
            value === "ruanglawak/index.html"
        ) {

            document
                .getElementById("navRuangLawak")
                .classList.add("active");

        }

    }


    pageFrame.addEventListener(
        "load",
        function() {

            const current =
                pageFrame.contentWindow.location.pathname;


            if (
                current.includes("ruangcewek")
            ) {

                updateActiveNav(
                    "ruangcewek/index.html"
                );

            }

            else if (
                current.includes("ruanglawak")
            ) {

                updateActiveNav(
                    "ruanglawak/index.html"
                );

            }

            else if (
                current.includes("home.html") ||
                current.endsWith("/")
            ) {

                updateActiveNav(
                    "home.html"
                );

            }

            else {

                const category =
                    localStorage.getItem(
                        "mw_category"
                    );

                updateActiveNav(
                    category || ""
                );

            }

        }
    );


</script>

</body></html>
