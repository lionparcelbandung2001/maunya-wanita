<!DOCTYPE html>
<html lang="id">
<head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F9LX0ZNCJ7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F9LX0ZNCJ7');
</script>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>YANG WANITA MAU ❤️❤️ — Rekomendasi Kecantikan, Healing, &amp; Ruang Curhat</title>

<meta
  name="description"
  content="CewekPedia adalah ruang informasi dan rekomendasi untuk wanita, mulai dari kecantikan, pernikahan, makan &amp; belanja, healing, hingga ruang curhat dan lawak."
>

<link
  rel="canonical"
  href="https://cewekpedia.com/"
>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

/* =========================================
   DASAR
   ========================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#fff7fb;
}

.shell{
    position:relative;
    width:100%;
    min-height:100vh;
    background:#fff7fb;
}


/* =========================================
   TOP BAR 1 — KATEGORI
   ========================================= */

.category-bar{

    position:sticky;
    top:0;

    z-index:9999;

    width:100%;

    min-height:42px;

    padding:3px 8px;

    display:flex;
    align-items:center;

    gap:5px;

    background:rgba(255,247,251,.98);

    border-bottom:1px solid #f1d2df;

    box-shadow:
        0 2px 9px rgba(217,47,114,.08);

    overflow-x:auto;

    scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
    display:none;
}


/* HOME BUTTON */

.home-button{

    flex:0 0 auto;

    border:none;

    background:#ff4f91;

    color:#fff;

    font-weight:bold;

    padding:8px 12px;

    border-radius:10px;

    cursor:pointer;

    white-space:nowrap;

    box-shadow:
        0 2px 7px rgba(255,79,145,.25);
}

.home-button:hover{
    opacity:.9;
}


/* CATEGORY BUTTON */

.category-button{

    flex:0 0 auto;

    border:1px solid #f2bfd2;

    background:#fff;

    color:#d93672;

    font-weight:bold;

    padding:7px 10px;

    border-radius:10px;

    cursor:pointer;

    white-space:nowrap;
}

.category-button:hover{
    background:#fff0f6;
}


/* =========================================
   TOP BAR 2 — KOTA
   ========================================= */

.city-bar{

    position:sticky;
    top:42px;

    z-index:9998;

    width:100%;

    min-height:38px;

    padding:3px 8px;

    display:flex;
    align-items:center;

    gap:5px;

    background:rgba(255,255,255,.97);

    border-bottom:1px solid #f1d2df;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);

    overflow-x:auto;

    scrollbar-width:none;
}

.city-bar::-webkit-scrollbar{
    display:none;
}


/* CITY BUTTON */

.city-button{

    flex:0 0 auto;

    border:1px solid #e5d1da;

    background:#fff;

    color:#555;

    font-size:13px;

    padding:6px 10px;

    border-radius:9px;

    cursor:pointer;

    white-space:nowrap;
}

.city-button:hover{
    background:#fff3f8;
}


/* =========================================
   CONTENT
   ========================================= */

.content-frame{

    width:100%;

    min-height:calc(100vh - 80px);

    border:none;

    display:block;

    background:#fff7fb;
}


/* =========================================
   MOBILE
   ========================================= */

@media(max-width:600px){

    .category-bar{
        min-height:40px;
    }

    .city-bar{
        top:40px;
    }

    .home-button{
        padding:7px 10px;
        font-size:13px;
    }

    .category-button{
        padding:6px 9px;
        font-size:13px;
    }

    .city-button{
        padding:5px 9px;
        font-size:12px;
    }

}


/* =========================================
   MUSIK
   ========================================= */

.music-frame{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:72px;
    border:none;
    z-index:10000;
    background:transparent;
}


/* =========================================
   MOBILE MUSIC
   ========================================= */

@media(max-width:600px){

    .music-frame{
        height:70px;
    }

}

</style>
</head>

<body>

<div class="shell">

    <!-- TOP BAR KATEGORI -->
    <div class="category-bar">

        <button
            class="home-button"
            onclick="goHome()"
        >
            ❤️ HOME
        </button>

        <button
            class="category-button"
            onclick="goCategory('cantik')"
        >
            💄 Pengen Cantik
        </button>

        <button
            class="category-button"
            onclick="goCategory('nikah')"
        >
            💍 Pengen Nikah
        </button>

        <button
            class="category-button"
            onclick="goCategory('makan')"
        >
            🍜 Makan &amp; Belanja
        </button>

        <button
            class="category-button"
            onclick="goCategory('healing')"
        >
            🌴 Healing
        </button>

        <button
            class="category-button"
            onclick="goPage('ruangcewek/index.html')"
        >
            💬 Ruang Cewek
        </button>

        <button
            class="category-button"
            onclick="goPage('ruanglawak/index.html')"
        >
            😂 Ruang Lawak
        </button>

    </div>


    <!-- TOP BAR KOTA -->
    <div class="city-bar">

        <button
            class="city-button"
            onclick="goCity('bandung')"
        >
            Bandung
        </button>

        <button
            class="city-button"
            onclick="goCity('jakarta')"
        >
            Jakarta
        </button>

        <button
            class="city-button"
            onclick="goCity('surabaya')"
        >
            Surabaya
        </button>

        <button
            class="city-button"
            onclick="goCity('medan')"
        >
            Medan
        </button>

        <button
            class="city-button"
            onclick="goCity('semarang')"
        >
            Semarang
        </button>

        <button
            class="city-button"
            onclick="goCity('makassar')"
        >
            Makassar
        </button>

    </div>


    <!-- CONTENT -->
    <iframe
        id="contentFrame"
        class="content-frame"
        src="home.html"
        title="CewekPedia"
        loading="eager"
    ></iframe>


    <!-- MUSIC -->
    <iframe
        class="music-frame"
        src="music-player.html"
        title="Music Player"
        loading="lazy"
    ></iframe>

</div>


<script>

function goHome(){

    localStorage.removeItem("mw_category");
    localStorage.removeItem("mw_city");
    localStorage.removeItem("mw_subcategory");

    document.getElementById("contentFrame").src =
        "home.html";

}


function goPage(page){

    document.getElementById("contentFrame").src =
        page;

}


function goCategory(category){

    localStorage.setItem(
        "mw_category",
        category
    );

    localStorage.removeItem("mw_subcategory");

    document.getElementById("contentFrame").src =
        "subkategori.html";

}


function goCity(city){

    localStorage.setItem(
        "mw_city",
        city
    );

    document.getElementById("contentFrame").src =
        "kota.html";

}

</script>

</body>
</html>
