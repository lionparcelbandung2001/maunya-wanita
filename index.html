<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MAUNYA WANITA ❤️❤️ — CewekPedia</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

    * {
        box-sizing: border-box;
    }


    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        min-height: 100%;

        background: #fff7fb;
    }


    /* =========================
       SHELL
    ========================= */

    .shell {
        width: 100%;
        min-height: 100vh;

        background: #fff7fb;
    }


    /* =========================
       TOP CATEGORY BAR
    ========================= */

    .category-bar {

        position: sticky;
        top: 0;

        z-index: 9999;

        width: 100%;

        min-height: 48px;

        padding: 6px 8px;

        display: flex;
        align-items: center;

        gap: 6px;

        background: rgba(255, 247, 251, 0.98);

        border-bottom: 1px solid #f1d2df;

        box-shadow:
            0 2px 9px rgba(217, 47, 114, 0.08);

        overflow-x: auto;

        scrollbar-width: none;
    }


    .category-bar::-webkit-scrollbar {
        display: none;
    }


    /* HOME */

    .home-button {

        flex-shrink: 0;

        width: 34px;
        height: 34px;

        border: none;

        border-radius: 50%;

        background: #fbe3ec;

        color: #d92f72;

        font-size: 17px;

        cursor: pointer;
    }


    .home-button.active {

        background: #d92f72;

        color: white;
    }


    /* CATEGORY BUTTONS */

    .category-links {

        display: flex;

        align-items: center;

        gap: 5px;

        flex-shrink: 0;
    }


    .category-links button {

        border: none;

        border-radius: 18px;

        padding: 7px 10px;

        background: #fbe3ec;

        color: #713b50;

        font-size: 11px;

        font-weight: bold;

        white-space: nowrap;

        cursor: pointer;
    }


    .category-links button.active {

        background: #d92f72;

        color: white;
    }


    .category-links button:hover {

        background: #f4cfde;
    }


    /* =========================
       MUSIC BAR
    ========================= */

    .music-area {

        width: 100%;

        height: 48px;

        padding: 3px 8px;

        background: #fff7fb;

        border-bottom: 1px solid #f1d2df;

        overflow: hidden;

        transition:
            height 0.2s ease,
            padding 0.2s ease;
    }


    /* HOME = FULL PLAYER */

    .music-area.home-music {

        height: 205px;

        padding: 5px 8px;
    }


    .music-frame {

        display: block;

        width: 100%;

        height: 100%;

        border: none;

        border-radius: 12px;

        background: transparent;
    }


    /* =========================
       PAGE CONTENT
    ========================= */

    #pageFrame {

        display: block;

        width: 100%;

        height: calc(100vh - 96px);

        min-height: 650px;

        border: none;

        background: #fff7fb;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        .category-bar {

            min-height: 46px;

            padding: 5px 6px;

            gap: 5px;
        }


        .home-button {

            width: 32px;

            height: 32px;

            font-size: 16px;
        }


        .category-links {

            gap: 4px;
        }


        .category-links button {

            padding: 6px 8px;

            font-size: 10px;
        }


        .music-area {

            height: 46px;

            padding: 3px 5px;
        }


        .music-area.home-music {

            height: 205px;

            padding: 4px 5px;
        }


        #pageFrame {

            height: calc(100vh - 92px);

            min-height: 650px;
        }

    }

</style>

</head><body><div class="shell"><!-- =================================
     TOP BAR 1
     6 MENU UTAMA
================================== -->

<nav class="category-bar">


    <button
        id="homeButton"
        class="home-button active"
        onclick="goHome()"
        aria-label="Beranda"
    >
        🏠
    </button>


    <div class="category-links">


        <button
            id="navCantik"
            onclick="goCategory('cantik')"
        >
            💄 Pengen Cantik
        </button>


        <button
            id="navNikah"
            onclick="goCategory('nikah')"
        >
            💍 Pengen Nikah
        </button>


        <button
            id="navMakan"
            onclick="goCategory('makan')"
        >
            🛍️ Makan & Belanja
        </button>


        <button
            id="navHealing"
            onclick="goCategory('healing')"
        >
            🌴 Jalan-jalan / Healing
        </button>


        <button
            id="navRuangCewek"
            onclick="goPage('ruangcewek/index.html')"
        >
            💬 Ruang Cewek
        </button>


        <button
            id="navRuangLawak"
            onclick="goPage('ruanglawak/index.html')"
        >
            😂 Ruang Lawak
        </button>


    </div>


</nav>


<!-- =================================
     TOP BAR 2
     MUSIC
================================== -->

<div
    id="musicArea"
    class="music-area home-music"
>

    <iframe
        id="musicFrame"
        class="music-frame"
        src="music-player.html"
        title="CewekPedia Music"
        scrolling="no"
    >
    </iframe>

</div>


<!-- =================================
     CONTENT
================================== -->

<iframe
    id="pageFrame"
    src="home.html"
    title="CewekPedia Content"
>
</iframe>

</div><script>


    const pageFrame =
        document.getElementById("pageFrame");


    const musicArea =
        document.getElementById("musicArea");


    /*
     * HOME
     */

    function goHome() {

        pageFrame.src = "home.html";

        setMusicMode(true);

        clearActive();

        document
            .getElementById("homeButton")
            .classList.add("active");

    }


    /*
     * CATEGORY
     */

    function goCategory(category) {

        localStorage.setItem(
            "mw_category",
            category
        );

        localStorage.removeItem(
            "mw_city"
        );

        localStorage.removeItem(
            "mw_subcategory"
        );


        pageFrame.src = "kota.html";


        setMusicMode(false);


        clearActive();


        if (category === "cantik") {

            document
                .getElementById("navCantik")
                .classList.add("active");

        }


        if (category === "nikah") {

            document
                .getElementById("navNikah")
                .classList.add("active");

        }


        if (category === "makan") {

            document
                .getElementById("navMakan")
                .classList.add("active");

        }


        if (category === "healing") {

            document
                .getElementById("navHealing")
                .classList.add("active");

        }

    }


    /*
     * OTHER PAGES
     */

    function goPage(url) {

        pageFrame.src = url;

        setMusicMode(false);

        clearActive();


        if (
            url === "ruangcewek/index.html"
        ) {

            document
                .getElementById("navRuangCewek")
                .classList.add("active");

        }


        if (
            url === "ruanglawak/index.html"
        ) {

            document
                .getElementById("navRuangLawak")
                .classList.add("active");

        }

    }


    /*
     * MUSIC MODE
     */

    function setMusicMode(isHome) {

        if (isHome) {

            musicArea.classList.add(
                "home-music"
            );

        } else {

            musicArea.classList.remove(
                "home-music"
            );

        }

    }


    /*
     * CLEAR ACTIVE
     */

    function clearActive() {

        document
            .querySelectorAll(
                ".category-links button"
            )
            .forEach(function(button) {

                button.classList.remove(
                    "active"
                );

            });


        document
            .getElementById("homeButton")
            .classList.remove("active");

    }


    /*
     * DETECT PAGE INSIDE IFRAME
     */

    pageFrame.addEventListener(
        "load",
        function() {

            let path = "";


            try {

                path =
                    pageFrame
                        .contentWindow
                        .location
                        .pathname;

            } catch (error) {

                return;

            }


            /*
             * HOME
             */

            if (
                path.endsWith("/") ||
                path.includes("home.html")
            ) {

                setMusicMode(true);

                clearActive();

                document
                    .getElementById(
                        "homeButton"
                    )
                    .classList.add("active");

                return;

            }


            /*
             * RUANG CEWEK
             */

            if (
                path.includes("ruangcewek")
            ) {

                setMusicMode(false);

                clearActive();

                document
                    .getElementById(
                        "navRuangCewek"
                    )
                    .classList.add("active");

                return;

            }


            /*
             * RUANG LAWAK
             */

            if (
                path.includes("ruanglawak")
            ) {

                setMusicMode(false);

                clearActive();

                document
                    .getElementById(
                        "navRuangLawak"
                    )
                    .classList.add("active");

                return;

            }


            /*
             * OTHER CATALOG PAGES
             */

            setMusicMode(false);


            const category =
                localStorage.getItem(
                    "mw_category"
                );


            clearActive();


            if (category === "cantik") {

                document
                    .getElementById(
                        "navCantik"
                    )
                    .classList.add("active");

            }


            if (category === "nikah") {

                document
                    .getElementById(
                        "navNikah"
                    )
                    .classList.add("active");

            }


            if (category === "makan") {

                document
                    .getElementById(
                        "navMakan"
                    )
                    .classList.add("active");

            }


            if (category === "healing") {

                document
                    .getElementById(
                        "navHealing"
                    )
                    .classList.add("active");

            }

        }
    );


</script></body></html>
