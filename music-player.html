<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CewekPedia Music</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        .music-box {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background: #fff7fb;
            border: 1px solid #f3c7d9;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(180, 70, 110, 0.08);
        }

        /* =========================
           MINI MUSIC BAR
        ========================= */

        .music-bar {
            min-height: 44px;
            padding: 7px 10px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;

            background: #fff;
        }

        .music-title {
            min-width: 0;
            flex: 1;

            color: #d92f72;
            font-size: 14px;
            font-weight: bold;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toggle-button {
            border: none;
            background: #d92f72;
            color: white;

            min-width: 38px;
            height: 30px;

            border-radius: 9px;
            cursor: pointer;

            font-size: 15px;
            font-weight: bold;
        }

        .toggle-button:hover {
            opacity: 0.9;
        }

        /* =========================
           PLAYER AREA
        ========================= */

        .music-content {
            display: none;
            padding: 7px 8px 8px;
            background: #fff7fb;
        }

        .music-content.open {
            display: block;
        }

        .playlist-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 7px;
            flex-wrap: wrap;
        }

        .playlist-button {
            flex: 1;
            min-width: 90px;

            border: 1px solid #efbfd3;
            background: white;
            color: #7d3b55;

            padding: 6px 8px;
            border-radius: 8px;

            cursor: pointer;
            font-size: 12px;
        }

        .playlist-button.active {
            background: #d92f72;
            color: white;
            border-color: #d92f72;
        }

        .soundcloud-frame {
            display: block;

            width: 100%;
            height: 166px;

            border: none;
            border-radius: 8px;
            background: white;
        }

        @media (max-width: 480px) {

            .music-title {
                font-size: 13px;
            }

            .playlist-button {
                min-width: 80px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <div class="music-box">

        <!-- MINI BAR -->
        <div class="music-bar">

            <div
                class="music-title"
                id="musicTitle"
            >
                🎵 🇮🇩 Pop Indonesia
            </div>

            <button
                class="toggle-button"
                id="toggleButton"
                onclick="toggleMusic()"
                aria-label="Buka atau tutup music player"
            >
                ▲
            </button>

        </div>


        <!-- PLAYER -->
        <div
            class="music-content"
            id="musicContent"
        >

            <div class="playlist-buttons">

                <button
                    class="playlist-button active"
                    id="popButton"
                    onclick="changeMusic('pop')"
                >
                    🇮🇩 Pop Indo
                </button>

                <button
                    class="playlist-button"
                    id="koreaButton"
                    onclick="changeMusic('korea')"
                >
                    🇰🇷 Korea
                </button>

                <button
                    class="playlist-button"
                    id="baratButton"
                    onclick="changeMusic('barat')"
                >
                    🌎 Barat
                </button>

            </div>


            <iframe
                id="soundcloudPlayer"
                class="soundcloud-frame"
                title="CewekPedia Music Player"
                scrolling="no"
                frameborder="no"
                allow="autoplay"
                src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fnugraha-74739955%2Fsets%2Fyy&color=%23d92f72&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false"
            >
            </iframe>

        </div>

    </div>


    <script>

        /* =========================
           PLAYLIST
        ========================= */

        const musicLinks = {

            pop:
                "https://soundcloud.com/nugraha-74739955/sets/yy",

            korea:
                "https://soundcloud.com/soundcloud-stories/sets/k-pop",

            barat:
                "https://soundcloud.com/miladgh-1/sets/rock-2"

        };


        /* =========================
           TOGGLE PLAYER
        ========================= */

        function toggleMusic() {

            const content =
                document.getElementById("musicContent");

            const button =
                document.getElementById("toggleButton");

            if (content.classList.contains("open")) {

                content.classList.remove("open");

                button.textContent = "▲";

            } else {

                content.classList.add("open");

                button.textContent = "▼";

            }

        }


        /* =========================
           BUILD SOUNDCLOUD URL
        ========================= */

        function buildPlayerUrl(
            soundcloudUrl,
            autoPlay
        ) {

            return (
                "https://w.soundcloud.com/player/?url="
                + encodeURIComponent(soundcloudUrl)
                + "&color=%23d92f72"
                + "&auto_play="
                + autoPlay
                + "&hide_related=true"
                + "&show_comments=false"
                + "&show_user=false"
                + "&show_reposts=false"
                + "&visual=false"
            );

        }


        /* =========================
           ACTIVE BUTTON
        ========================= */

        function setActiveButton(type) {

            document
                .querySelectorAll(".playlist-button")
                .forEach(function(button) {

                    button.classList.remove("active");

                });


            if (type === "pop") {

                document
                    .getElementById("popButton")
                    .classList.add("active");

            }

            if (type === "korea") {

                document
                    .getElementById("koreaButton")
                    .classList.add("active");

            }

            if (type === "barat") {

                document
                    .getElementById("baratButton")
                    .classList.add("active");

            }

        }


        /* =========================
           CHANGE MUSIC
        ========================= */

        function changeMusic(type) {

            const player =
                document.getElementById(
                    "soundcloudPlayer"
                );

            const title =
                document.getElementById(
                    "musicTitle"
                );


            if (
                !player ||
                !musicLinks[type]
            ) {

                return;

            }


            setActiveButton(type);


            if (type === "pop") {

                title.textContent =
                    "🎵 🇮🇩 Pop Indonesia";

            }

            if (type === "korea") {

                title.textContent =
                    "🎵 🇰🇷 Korea";

            }

            if (type === "barat") {

                title.textContent =
                    "🎵 🌎 Barat";

            }


            player.src =
                buildPlayerUrl(
                    musicLinks[type],
                    true
                );

        }

    </script>

</body>

</html>
