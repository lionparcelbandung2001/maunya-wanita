<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CewekPedia Music</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;}
.music-box{width:100%;height:100%;padding:5px;display:flex;flex-direction:column;gap:5px;background:#fff7fb;overflow:hidden;}
.music-title{flex-shrink:0;text-align:center;color:#d92f72;font-size:14px;font-weight:bold;}
.playlist{flex-shrink:0;display:flex;justify-content:center;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;}
.playlist::-webkit-scrollbar{display:none;}
.playlist button{flex-shrink:0;border:none;border-radius:16px;padding:6px 10px;background:#f9dce8;color:#6d4051;font-size:10px;font-weight:bold;white-space:nowrap;cursor:pointer;}
.playlist button.active{background:#d92f72;color:white;}
.soundcloud-wrap{flex:1;min-height:0;width:100%;overflow:hidden;border-radius:10px;position:relative;}
.soundcloud{width:100%;height:166px;border:none;display:block;}
.mini .music-box{position:relative;flex-direction:row;align-items:center;gap:5px;padding:3px 5px;overflow:hidden;}
.mini .music-title{flex-shrink:0;width:18px;font-size:10px;text-align:center;}
.mini .playlist{flex:1;min-width:0;justify-content:flex-start;overflow-x:auto;}
.mini .playlist button{padding:5px 7px;font-size:8px;}
.mini .music-hint{display:block;position:absolute;right:7px;top:-1px;z-index:20;font-size:7px;font-weight:bold;color:#d92f72;background:rgba(255,247,251,.95);padding:1px 4px;border-radius:6px;pointer-events:none;}
.mini .soundcloud-wrap{flex-shrink:0;width:110px;height:48px;overflow:hidden;border-radius:9px;position:relative;}
.mini .soundcloud{position:absolute;left:-2px;top:-8px;width:120px;height:68px;border:none;}
.music-hint{display:none;}
@media(max-width:600px){
.mini .playlist button{padding:5px 6px;font-size:8px;}
.mini .soundcloud-wrap{width:95px;height:46px;}
.mini .soundcloud{width:105px;height:65px;top:-7px;left:-2px;}
.mini .music-hint{right:5px;top:-1px;font-size:7px;}
}
</style>
</head>
<body>
<div class="music-box">
<div class="music-title">🎵</div>
<div class="playlist">
<button id="btnIndonesia" class="active" onclick="changeMusic('indonesia')">🇮🇩 Indo</button>
<button id="btnKorea" onclick="changeMusic('korea')">🇰🇷 Korea</button>
<button id="btnBarat" onclick="changeMusic('barat')">🌎 Barat</button>
</div>
<div class="soundcloud-wrap">
<iframe id="soundcloudPlayer" class="soundcloud" title="CewekPedia Music Player" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
</div>
<div class="music-hint"></div>
</div>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
const indonesiaPlaylists = [
"https://soundcloud.com/ega-febryan",
"https://soundcloud.com/frans-seno",
"https://soundcloud.com/simon-lyrics",
"https://soundcloud.com/zulkhairi-khairi-khan/sets/pop",
"https://soundcloud.com/kadek-dwi-witayani/sets/lagu-tahun-2000an"
];
const musicLinks = {
korea: [
"https://soundcloud.com/vanessaa0303",
"https://soundcloud.com/dana-cell-106037944/sets/lagu-korea-drama",
"https://soundcloud.com/leovivin"
],
barat: [
"https://soundcloud.com/user-100795044",
"https://soundcloud.com/user-707735355/2019-slow-rock-barat-terbaik-sepanjang-masa",
"https://soundcloud.com/riki-hermawan-937446363",
"https://soundcloud.com/arhasel",
"https://soundcloud.com/user-475170813"
]
};
function getRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function getRandomIndonesiaPlaylist(){return getRandom(indonesiaPlaylists);}
let scWidget = null;
function loadSoundCloud(url){
const player=document.getElementById("soundcloudPlayer");
const encodedUrl=encodeURIComponent(url);
player.src="https://w.soundcloud.com/player/?url="+encodedUrl+"&color=%23d92f72&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false";
// Tambahan acak awal lagu - tanpa ubah setting lain
try{
  scWidget = SC.Widget(player);
  scWidget.bind(SC.Widget.Events.READY, function(){
    scWidget.getSounds(function(sounds){
      if(sounds && sounds.length > 1){
        let randomIndex = Math.floor(Math.random()*sounds.length);
        scWidget.skip(randomIndex);
        scWidget.pause();
      }
    });
  });
}catch(e){}
}
function changeMusic(type){
let selectedUrl;
if(type==="indonesia"){selectedUrl=getRandomIndonesiaPlaylist();}
if(type==="korea"){selectedUrl=getRandom(musicLinks.korea);}
if(type==="barat"){selectedUrl=getRandom(musicLinks.barat);}
loadSoundCloud(selectedUrl);
document.querySelectorAll(".playlist button").forEach(function(button){button.classList.remove("active");});
if(type==="indonesia"){document.getElementById("btnIndonesia").classList.add("active");}
if(type==="korea"){document.getElementById("btnKorea").classList.add("active");}
if(type==="barat"){document.getElementById("btnBarat").classList.add("active");}
}
function loadDefaultIndonesia(){const randomIndonesia=getRandomIndonesiaPlaylist();loadSoundCloud(randomIndonesia);}
function detectPlayerMode(){if(window.innerHeight<120){document.body.classList.add("mini");}else{document.body.classList.remove("mini");}}
loadDefaultIndonesia();
detectPlayerMode();
window.addEventListener("resize",detectPlayerMode);
</script>
</body>
</html>
