<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CewekPedia Music</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Segoe UI',Arial,sans-serif;}
.music-box{
  width:100%;height:100%;padding:8px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(135deg,#ff2e88 0%,#ff6ab5 30%,#a855f7 70%,#6366f1 100%);
  overflow:hidden;box-shadow:inset 0 0 30px rgba(255,255,255,.15);
}
.music-title{
  flex-shrink:0;text-align:center;color:#fff;font-size:16px;font-weight:900;
  text-shadow:0 2px 8px rgba(0,0,0,.35),0 0 15px rgba(255,255,255,.6);
  letter-spacing:1px;
}
.playlist{flex-shrink:0;display:flex;justify-content:center;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px;}
.playlist::-webkit-scrollbar{display:none;}
.playlist button{
  flex-shrink:0;border:2px solid rgba(255,255,255,.9);border-radius:20px;padding:10px 18px;
  background:rgba(255,255,255,.92);
  color:#111;font-size:14px;font-weight:900;white-space:nowrap;cursor:pointer;
  transition:all .25s ease;box-shadow:0 3px 10px rgba(0,0,0,.2);
  min-width:90px;text-align:center;
}
.playlist button:hover{transform:translateY(-2px) scale(1.05);background:#ffffff;box-shadow:0 5px 15px rgba(0,0,0,.3);}
.playlist button.active{
  background:linear-gradient(135deg,#ffeb3b,#ff9800);
  color:#111;border-color:#fff;
  box-shadow:0 0 15px rgba(255,235,59,.9),0 4px 12px rgba(0,0,0,.3);
  transform:scale(1.08);
}
.soundcloud-wrap{flex:1;min-height:0;width:100%;overflow:hidden;border-radius:12px;position:relative;background:rgba(255,255,255,.95);box-shadow:0 4px 15px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.6);}
.soundcloud{width:100%;height:166px;border:none;display:block;}
.mini .music-box{position:relative;flex-direction:row;align-items:center;gap:8px;padding:5px 8px;overflow:hidden;}
.mini .music-title{flex-shrink:0;width:24px;font-size:14px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.mini .playlist{flex:1;min-width:0;justify-content:flex-start;overflow-x:auto;gap:8px;}
.mini .playlist button{padding:8px 12px;font-size:12px;min-width:70px;}
.mini .music-hint{display:block;position:absolute;right:7px;top:2px;z-index:20;font-size:8px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff2e88,#a855f7);padding:2px 7px;border-radius:10px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.mini .soundcloud-wrap{flex-shrink:0;width:115px;height:52px;}
.mini .soundcloud{position:absolute;left:-2px;top:-8px;width:125px;height:70px;border:none;}
.music-hint{display:none;}
@media(max-width:600px){
.mini .playlist button{padding:7px 10px;font-size:11px;min-width:65px;}
.mini .soundcloud-wrap{width:100px;height:48px;}
.mini .soundcloud{width:110px;height:66px;top:-7px;left:-2px;}
}
</style>
</head>
<body>
<div class="music-box">
<div class="music-title">🎵 CEWEKPEDIA MUSIC 🎵</div>
<div class="playlist">
<button id="btnIndonesia" class="active" onclick="changeMusic('indonesia')">🇮🇩 Indo</button>
<button id="btnKorea" onclick="changeMusic('korea')">🇰🇷 Korea</button>
<button id="btnBarat" onclick="changeMusic('barat')">🌎 Barat</button>
</div>
<div class="soundcloud-wrap">
<iframe id="soundcloudPlayer" class="soundcloud" title="CewekPedia Music Player" scrolling="no" frameborder="no" allow="autoplay" src=""></iframe>
</div>
<div class="music-hint">▶ TAP PLAY</div>
</div>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
const indonesiaPlaylists = [
"https://soundcloud.com/ngabang99/lagu_minang_terbaik_2021",
"https://soundcloud.com/artur-setyo/tomp3-cc-wali-band-full-album",
"https://soundcloud.com/purwanto-ipunk-968701795/ungu-full-album-terbaik-lagu",
"https://soundcloud.com/abeng-598972940/full-album-ada-band-romantic-rhapsody-2006",
"https://soundcloud.com/rendi-mandala-960988229/sri-fayola-full-album-terbaru"
];
const musicLinks = {
korea: [
"https://soundcloud.com/rennieology/sets/k-pop-hits-lagu-k-pop-terbaik",
"https://soundcloud.com/dana-cell-106037944/sets/lagu-korea-drama",
"https://soundcloud.com/imam-syaifuddin-826248748/sets/lagu-korea-sedih",
"https://soundcloud.com/aiszue/sets/korean-soundtrack"
],
barat: [
"https://soundcloud.com/user-707735355/2019-slow-rock-barat-terbaik-sepanjang-masa",
"https://soundcloud.com/user-674020508/slow-rock-barat-90an",
"https://soundcloud.com/i-gusti-sabda-langit/lagu-barat-rock-of-the-2000s",
"https://soundcloud.com/fariz-teknisi/sets/barat-terbaik-1",
"https://soundcloud.com/adhi-padma-365781635/scorpions-aerosmith-bon-jovi"
]
};
let currentCategory = 'indonesia';
let userHasPlayed = false;
let scWidget = null;
let lastUrl = "";
function getRandom(arr){
  let filtered = arr.filter(u => u !== lastUrl);
  if(filtered.length===0) filtered = arr;
  const picked = filtered[Math.floor(Math.random()*filtered.length)];
  lastUrl = picked;
  return picked;
}
function getRandomIndonesiaPlaylist(){return getRandom(indonesiaPlaylists);}
function shuffleToRandomTrack(){
  if(!scWidget) return;
  try{
    scWidget.getSounds(function(sounds){
      if(sounds && sounds.length > 1){
        let randomIndex = Math.floor(Math.random()*sounds.length);
        scWidget.skip(randomIndex);
        if(!userHasPlayed){ try{ scWidget.pause(); }catch(e){} }
      }
    });
  }catch(e){}
}
function loadSoundCloud(url, forceAutoPlay = false){
const player = document.getElementById("soundcloudPlayer");
const shouldAutoPlay = forceAutoPlay || userHasPlayed;
if(!scWidget){
  const encodedUrl = encodeURIComponent(url);
  player.src = "https://w.soundcloud.com/player/?url=" + encodedUrl + "&color=%23ff2e88&auto_play=" + shouldAutoPlay + "&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false";
  try{
    scWidget = SC.Widget(player);
    scWidget.bind(SC.Widget.Events.READY, function(){
      scWidget.bind(SC.Widget.Events.PLAY, function(){ userHasPlayed = true; });
      scWidget.bind(SC.Widget.Events.FINISH, function(){
        changeMusic(currentCategory, true);
      });
      setTimeout(shuffleToRandomTrack, 800);
    });
  }catch(e){}
} else {
  try{
    scWidget.load(url,{
      color:'#ff2e88',auto_play:shouldAutoPlay,
      hide_related:true,show_comments:false,show_user:false,show_reposts:false,visual:false,
      callback: function(){ setTimeout(shuffleToRandomTrack, 800); }
    });
    if(shouldAutoPlay){ setTimeout(function(){ try{ scWidget.play(); }catch(err){} }, 1200); }
    else { setTimeout(shuffleToRandomTrack, 1200); }
  }catch(e){
    const encodedUrl = encodeURIComponent(url);
    player.src = "https://w.soundcloud.com/player/?url=" + encodedUrl + "&color=%23ff2e88&auto_play=" + shouldAutoPlay + "&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false";
  }
}
}
function changeMusic(type, forceAutoPlay = false){
currentCategory = type; let selectedUrl;
if(type==="indonesia"){selectedUrl=getRandomIndonesiaPlaylist();}
if(type==="korea"){selectedUrl=getRandom(musicLinks.korea);}
if(type==="barat"){selectedUrl=getRandom(musicLinks.barat);}
loadSoundCloud(selectedUrl, forceAutoPlay);
document.querySelectorAll(".playlist button").forEach(function(button){button.classList.remove("active");});
if(type==="indonesia"){document.getElementById("btnIndonesia").classList.add("active");}
if(type==="korea"){document.getElementById("btnKorea").classList.add("active");}
if(type==="barat"){document.getElementById("btnBarat").classList.add("active");}
}
function loadDefaultIndonesia(){const randomIndonesia=getRandomIndonesiaPlaylist();loadSoundCloud(randomIndonesia);}
function detectPlayerMode(){if(window.innerHeight<120){document.body.classList.add("mini");}else{document.body.classList.remove("mini");}}
loadDefaultIndonesia(); detectPlayerMode(); window.addEventListener("resize",detectPlayerMode);
</script>
</body>
</html>
