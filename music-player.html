<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CewekPedia Music</title>

<style>
    body {
        margin: 0;
        padding: 20px;
        background: #fff7fb;
        color: #3a2630;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #d92f72;
        margin-bottom: 6px;
    }

    .subtitle {
        margin-bottom: 20px;
        font-size: 14px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }

    button {
        border: none;
        border-radius: 20px;
        padding: 10px 16px;
        background: white;
        color: #d92f72;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button.active {
        background: #d92f72;
        color: white;
    }

    .player-box {
        max-width: 900px;
        margin: auto;
        background: white;
        border-radius: 16px;
        padding: 10px;
        box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    }

    iframe {
        width: 100%;
        height: 166px;
        border: none;
        border-radius: 12px;
    }

    .note {
        max-width: 850px;
        margin: 18px auto 0;
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.75;
    }

    .mini iframe {
        height: 100px;
    }
</style>
</head>

<body>

<h1>🎵 CewekPedia Music</h1>

<div class="subtitle">
    Temani waktu santaimu dengan musik pilihan ❤️
</div>

<div class="buttons">
    <button id="btnIndo" onclick="showCategory('indonesia')">
        🇮🇩 Indo
    </button>

    <button id="btnKorea" onclick="showCategory('korea')">
        🇰🇷 Korea
    </button>

    <button id="btnBarat" onclick="showCategory('barat')">
        🌎 Barat
    </button>
</div>

<div class="player-box" id="playerBox">
    <iframe
        id="soundcloudPlayer"
        allow="autoplay">
    </iframe>
</div>

<div class="note">
    Musik diputar melalui pemutar resmi SoundCloud.
    Hak cipta dan lisensi masing-masing lagu tetap menjadi milik
    artis/pemegang haknya.
</div>

<script>

const indonesiaPlaylists = [

    // Peterpan / NOAH
    "https://soundcloud.com/noah_site/sets/bintang-di-surga",

    // Playlist pop Indonesia 2000-an
    "https://soundcloud.com/asgun-channel/sets/peterpan"

];


const koreaPlaylists = [

    // Korean ballad / K-pop nostalgia
    "https://soundcloud.com/user-678728947-759766535/sets/kpop-ballard"

];


const baratPlaylists = [

    // Slow rock / rock nostalgia
    "https://soundcloud.com/dani-danky/sets/barat"

];


function getRandomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}


function loadPlayer(url) {

    const player = document.getElementById("soundcloudPlayer");

    const encodedUrl = encodeURIComponent(url);

    player.src =
        "https://w.soundcloud.com/player/?url="
        + encodedUrl
        + "&color=%23d92f72"
        + "&auto_play=false"
        + "&hide_related=true"
        + "&show_comments=false"
        + "&show_user=false"
        + "&show_reposts=false"
        + "&visual=false";
}


function setActive(buttonId) {

    document.querySelectorAll(".buttons button")
        .forEach(button => {
            button.classList.remove("active");
        });

    document.getElementById(buttonId)
        .classList.add("active");
}


function showCategory(category) {

    let playlist;

    if (category === "indonesia") {

        playlist = getRandomItem(indonesiaPlaylists);

        setActive("btnIndo");

    }

    else if (category === "korea") {

        playlist = getRandomItem(koreaPlaylists);

        setActive("btnKorea");

    }

    else if (category === "barat") {

        playlist = getRandomItem(baratPlaylists);

        setActive("btnBarat");

    }

    loadPlayer(playlist);
}


/*
    Default:
    🇮🇩 Indonesia
*/

showCategory("indonesia");


/*
    Tampilan mini jika iframe dipakai
    di area yang sangat pendek.
*/

function detectPlayerMode() {

    const box = document.getElementById("playerBox");

    if (window.innerHeight < 120) {
        box.classList.add("mini");
    } else {
        box.classList.remove("mini");
    }
}

detectPlayerMode();

window.addEventListener(
    "resize",
    detectPlayerMode
);

</script>

</body>
</html>
