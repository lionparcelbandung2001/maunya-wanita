<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CewekPedia Music</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
    }

    .music-box {
        width: 100%;
        height: 100%;

        display: flex;
        align-items: center;

        gap: 5px;
        padding: 3px 5px;

        background: #fff7fb;
    }

    .music-label {
        flex-shrink: 0;

        color: #d92f72;

        font-size: 11px;
        font-weight: bold;

        white-space: nowrap;
    }

    .playlist {
        flex: 1;
        min-width: 0;

        display: flex;

        gap: 3px;

        overflow-x: auto;

        scrollbar-width: none;
    }

    .playlist::-webkit-scrollbar {
        display: none;
    }

    .playlist button {
        flex-shrink: 0;

        border: none;

        border-radius: 14px;

        background: #f9dce8;

        color: #6d4051;

        padding: 5px 7px;

        font-size: 9px;
        font-weight: bold;

        white-space: nowrap;

        cursor: pointer;
    }

    .playlist button.active {
        background: #d92f72;
        color: white;
    }

    .soundcloud {
        flex-shrink: 0;

        width: 85px;
        height: 36px;

        border: none;

        border-radius: 10px;

        overflow: hidden;
    }

    @media (max-width: 600px) {

        .music-label {
            font-size: 10px;
        }

        .playlist button {
            font-size: 8px;
            padding: 5px 6px;
        }

        .soundcloud {
            width: 75px;
            height: 34px;
        }

    }

</style>

</head><body><div class="music-box">


    <div class="music-label">
        🎵
    </div>


    <div class="playlist">


        <button
            id="btnIndonesia"
            class="active"
            onclick="changeMusic('indonesia')"
        >
            🇮🇩 Indo
        </button>


        <button
            id="btnKorea"
            onclick="changeMusic('korea')"
        >
            🇰🇷 Korea
        </button>


        <button
            id="btnBarat"
            onclick="changeMusic('barat')"
        >
            🌎 Barat
        </button>


    </div>


    <iframe
        id="soundcloudPlayer"
        class="soundcloud"
        title="CewekPedia Music Player"
        scrolling="no"
        frameborder="no"
        allow="autoplay"
        src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fnugraha-74739955%2Fsets%2Fyy&color=%23d92f72&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false"
    >
    </iframe>


</div>


<script>


    const musicLinks = {

        /*
         * 🇮🇩 INDONESIA
         *
         * Playlist dimulai dengan:
         * Ungu - Demi Waktu
         *
         * Kemudian berisi lagu Indonesia
         * termasuk Dewa 19, Noah/Peterpan,
         * dan lagu-lagu sejenis.
         */

        indonesia:
            "https://soundcloud.com/nugraha-74739955/sets/yy",


        /*
         * 🇰🇷 KOREA
         *
         * Playlist berisi OST Korea dan
         * K-pop nostalgia.
         *
         * Full House - Bi Rain tersedia
         * di playlist.
         */

        korea:
            "https://soundcloud.com/oyukh-h/sets/korean",


        /*
         * 🌎 BARAT
         *
         * Playlist dimulai dengan:
         * Evanescence - Bring Me To Life
         *
         * Kemudian rock/pop era 2000-an.
         */

        barat:
            "https://soundcloud.com/alireza-eshraghjahromi/evanescence-greatest-hitsbest-songs"

    };


    function changeMusic(type) {


        const player =
            document.getElementById(
                "soundcloudPlayer"
            );


        const url =
            encodeURIComponent(
                musicLinks[type]
            );


        player.src =
            "https://w.soundcloud.com/player/?" +
            "url=" + url +
            "&color=%23d92f72" +
            "&auto_play=false" +
            "&hide_related=true" +
            "&show_comments=false" +
            "&show_user=false" +
            "&show_reposts=false" +
            "&visual=false";


        document
            .querySelectorAll(
                ".playlist button"
            )
            .forEach(function(button) {

                button.classList.remove(
                    "active"
                );

            });


        if (type === "indonesia") {

            document
                .getElementById(
                    "btnIndonesia"
                )
                .classList.add("active");

        }


        if (type === "korea") {

            document
                .getElementById(
                    "btnKorea"
                )
                .classList.add("active");

        }


        if (type === "barat") {

            document
                .getElementById(
                    "btnBarat"
                )
                .classList.add("active");

        }

    }


</script>

</body></html>
