<!DOCTYPE html><html lang="id"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Music Player — CewekPedia</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: Arial, sans-serif;
    }

    .music-player {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        padding: 8px;

        background: #ffffff;
        border: 1px solid #f0dce6;
        border-radius: 14px;

        box-shadow: 0 2px 10px rgba(80, 40, 60, 0.07);
    }

    .music-title {
        text-align: center;
        color: #6a4655;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .music-buttons {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-bottom: 6px;
        flex-wrap: wrap;
    }

    .music-buttons button {
        border: 1px solid #efdce6;
        background: #fff7fb;
        color: #633f4d;

        border-radius: 18px;
        padding: 5px 9px;

        font-size: 11px;
        font-weight: 600;

        cursor: pointer;
    }

    .music-buttons button.active {
        background: #d92f72;
        color: #ffffff;
        border-color: #d92f72;
    }

    .soundcloud-frame {
        display: block;
        width: 100%;
        height: 81px;
        border: 0;
        border-radius: 9px;
    }

    @media (max-width: 600px) {

        .music-player {
            padding: 7px;
            border-radius: 12px;
        }

        .music-title {
            font-size: 11px;
        }

        .music-buttons button {
            padding: 5px 8px;
            font-size: 10px;
        }

        .soundcloud-frame {
            height: 81px;
        }
    }
</style>

</head><body><div class="music-player">

    <div class="music-title">
        🎵 Teman Dengerin Kamu
    </div>

    <div class="music-buttons">

        <button
            id="music-pop"
            class="active"
            onclick="changeMusic('pop')">
            🇮🇩 Pop Indonesia
        </button>

        <button
            id="music-korea"
            onclick="changeMusic('korea')">
            🇰🇷 Korea
        </button>

        <button
            id="music-barat"
            onclick="changeMusic('barat')">
            🌎 Slow Rock Barat
        </button>

    </div>

    <iframe
        id="soundcloudPlayer"
        class="soundcloud-frame"
        title="CewekPedia Music Player"
        scrolling="no"
        allow="autoplay"
        src="https://w.soundcloud.com/player/api.html?url=https%3A//soundcloud.com/nugraha-74739955/sets/yy&color=%23d92f72&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false">
    </iframe>

</div>


<script>

    /*
     * =========================================
     * PLAYLIST CEWEKPEDIA
     * =========================================
     */

    const musicLinks = {

        /*
         * DEFAULT
         * Pop Indonesia nostalgia
         * Dewa 19, Ungu, Peterpan/Noah,
         * Once, Last Child, dan lainnya.
         */
        pop:
            "https://soundcloud.com/nugraha-74739955/sets/yy",

        /*
         * K-POP
         * Playlist K-Pop
         */
        korea:
            "https://soundcloud.com/soundcloud-stories/sets/k-pop",

        /*
         * SLOW ROCK BARAT
         */
        barat:
            "https://soundcloud.com/miladgh-1/sets/rock-2"

    };


    /*
     * =========================================
     * GANTI MUSIK
     * =========================================
     */

    function changeMusic(type) {

        const player =
            document.getElementById("soundcloudPlayer");

        const buttons = [
            "pop",
            "korea",
            "barat"
        ];


        buttons.forEach(function(item) {

            const button =
                document.getElementById("music-" + item);

            if (button) {
                button.classList.remove("active");
            }

        });


        const activeButton =
            document.getElementById("music-" + type);

        if (activeButton) {
            activeButton.classList.add("active");
        }


        const url =
            encodeURIComponent(musicLinks[type]);


        player.src =
            "https://w.soundcloud.com/player/api.html?url="
            + url
            + "&color=%23d92f72"
            + "&auto_play=true"
            + "&hide_related=true"
            + "&show_comments=false"
            + "&show_user=false"
            + "&show_reposts=false"
            + "&visual=false";

    }

</script>

</body></html>
