<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CewekPedia Music Player</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: Arial, sans-serif;
    }

    .music-player {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 7px;
        background: #ffffff;
        border: 1px solid #f0dce6;
        border-radius: 14px;
        box-shadow: 0 2px 10px rgba(80, 40, 60, 0.07);
    }

    .music-title {
        text-align: center;
        color: #6a4655;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .music-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        margin-bottom: 7px;
        flex-wrap: wrap;
    }

    .music-buttons button {
        border: 1px solid #efdce6;
        background: #fff7fb;
        color: #633f4d;
        border-radius: 18px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
    }

    .music-buttons button.active {
        background: #d92f72;
        color: #ffffff;
        border-color: #d92f72;
    }

    .music-buttons button:active {
        transform: scale(0.97);
    }

    .soundcloud-frame {
        display: block;
        width: 100%;
        height: 166px;
        border: 0;
        border-radius: 9px;
        overflow: hidden;
    }

    @media (max-width: 600px) {

        .music-player {
            padding: 6px;
            border-radius: 12px;
        }

        .music-title {
            font-size: 11px;
            margin-bottom: 5px;
        }

        .music-buttons {
            gap: 4px;
            margin-bottom: 6px;
        }

        .music-buttons button {
            padding: 5px 7px;
            font-size: 10px;
        }

        .soundcloud-frame {
            height: 166px;
        }

    }

</style>

</head><body><div class="music-player"><div class="music-title">
    🎵 Teman Dengerin Kamu
</div>

<div class="music-buttons">

    <button
        id="music-pop"
        class="active"
        onclick="changeMusic('pop')"
    >
        🇮🇩 Pop Indonesia
    </button>

    <button
        id="music-korea"
        onclick="changeMusic('korea')"
    >
        🇰🇷 Korea
    </button>

    <button
        id="music-barat"
        onclick="changeMusic('barat')"
    >
        🌎 Slow Rock Barat
    </button>

</div>

<iframe
    id="soundcloudPlayer"
    class="soundcloud-frame"
    title="CewekPedia Music Player"
    scrolling="no"
    frameborder="no"
    allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fnugraha-74739955%2Fsets%2Fyy&color=%23d92f72&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false"
>
</iframe>

</div><script>

    const musicLinks = {

        pop:
            "https://soundcloud.com/nugraha-74739955/sets/yy",

        korea:
            "https://soundcloud.com/soundcloud-stories/sets/k-pop",

        barat:
            "https://soundcloud.com/miladgh-1/sets/rock-2"

    };


    function buildPlayerUrl(soundcloudUrl, autoPlay) {

        return (
            "https://w.soundcloud.com/player/?url="
            + encodeURIComponent(soundcloudUrl)
            + "&color=%23d92f72"
            + "&auto_play="
            + autoPlay
            + "&hide_related=true"
            + "&show_comments=false"
            + "&show_user=false"
            + "&show_reposts=false"
            + "&visual=false"
        );

    }


    function setActiveButton(type) {

        const buttons = [
            "pop",
            "korea",
            "barat"
        ];

        buttons.forEach(function(item) {

            const button =
                document.getElementById("music-" + item);

            if (button) {
                button.classList.remove("active");
            }

        });


        const activeButton =
            document.getElementById("music-" + type);

        if (activeButton) {
            activeButton.classList.add("active");
        }

    }


    function changeMusic(type) {

        const player =
            document.getElementById("soundcloudPlayer");

        if (!player || !musicLinks[type]) {
            return;
        }


        setActiveButton(type);


        player.src =
            buildPlayerUrl(
                musicLinks[type],
                true
            );

    }

</script></body></html>
