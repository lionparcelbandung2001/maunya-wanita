<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Review Produk ⭐ | Ruang Cewek</title>

  <meta
    name="description"
    content="Baca dan bagikan review produk, makanan, dan penginapan di Ruang Cewek."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #3a2630;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #d92f72;
      text-decoration: none;
      font-weight: bold;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 8px;
      color: #d92f72;
      font-size: 29px;
    }

    .tagline {
      color: #777;
      line-height: 1.6;
    }

    .send-box {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .send-box p {
      margin-top: 0;
      color: #666;
      line-height: 1.6;
    }

    .send-button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      background: #d92f72;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
      justify-content: center;
    }

    .filter-button {
      border: 1px solid #edcbd9;
      background: white;
      color: #d92f72;
      padding: 9px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-button.active {
      background: #d92f72;
      color: white;
      border-color: #d92f72;
    }

    #reviewList {
      display: grid;
      gap: 15px;
    }

    .review-card {
      display: block;
      background: white;
      border-radius: 17px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.15s ease;
    }

    .review-card:hover {
      transform: translateY(-2px);
    }

    .category {
      display: inline-block;
      background: #fff0f6;
      color: #d92f72;
      padding: 5px 9px;
      border-radius: 9px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .review-title {
      margin: 0 0 9px;
      color: #d92f72;
      font-size: 20px;
      line-height: 1.4;
    }

    .preview {
      margin: 0 0 12px;
      color: #555;
      line-height: 1.6;
      font-size: 14px;
    }

    .meta {
      color: #999;
      font-size: 12px;
    }

    .read-more {
      margin-top: 12px;
      color: #d92f72;
      font-weight: bold;
      font-size: 13px;
    }

    .loading,
    .empty,
    .error {
      background: white;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      line-height: 1.7;
    }

    .error {
      background: #fff0f0;
      color: #a52a2a;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      h1 {
        font-size: 25px;
      }

      .filter-button {
        font-size: 12px;
        padding: 8px 11px;
      }

      .review-card {
        padding: 17px;
      }

      .review-title {
        font-size: 18px;
      }

    }
  </style>
</head>

<body>

<div class="container">

  <a href="index.html" class="back">
    ← Kembali ke Ruang Cewek
  </a>

  <header>

    <h1>⭐ Review Produk</h1>

    <div class="tagline">
      Cerita pengalaman • Berbagi pendapat • Bantu yang lain ❤️
    </div>

  </header>


  <!-- KIRIM REVIEW -->

  <div class="send-box">

    <p>
      Pernah mencoba produk, makanan, atau penginapan?
      Bagikan pengalaman kamu di sini.
    </p>

    <a
      href="kirimreview.html"
      class="send-button"
    >
      ⭐ Kirim Review
    </a>

  </div>


  <!-- FILTER -->

  <div class="filters">

    <button
      class="filter-button active"
      data-category="Semua"
    >
      Semua
    </button>

    <button
      class="filter-button"
      data-category="Fashion"
    >
      👗 Fashion
    </button>

    <button
      class="filter-button"
      data-category="Makeup"
    >
      💄 Makeup
    </button>

    <button
      class="filter-button"
      data-category="Makanan & Penginapan"
    >
      🍽️ Makanan & Penginapan
    </button>

  </div>


  <!-- DAFTAR REVIEW -->

  <div id="reviewList">

    <div class="loading">
      ⏳ Memuat review...
    </div>

  </div>


  <footer>
    © CewekPedia — Ruang Cewek ❤️
  </footer>

</div>


<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    get,
    query,
    orderByChild,
    equalTo
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  import {
    getAuth,
    signInAnonymously
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  /* =========================
     FIREBASE CONFIG
     ========================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCnhVGlnGKoqddyLvOgE7t4MGG926iQ8O0",

    authDomain:
      "ruang-cewek.firebaseapp.com",

    databaseURL:
      "https://ruang-cewek-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
      "ruang-cewek",

    storageBucket:
      "ruang-cewek.firebasestorage.app",

    messagingSenderId:
      "300030693884",

    appId:
      "1:300030693884:web:ec02ce2cf35646dbf3a279"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getDatabase(app);

  const auth =
    getAuth(app);


  const reviewList =
    document.getElementById("reviewList");


  let allReviews = [];

  let currentCategory = "Semua";


  /* =========================
     LOGIN ANONIM
     ========================= */

  async function start() {

    try {

      if (!auth.currentUser) {

        await signInAnonymously(auth);

      }

      await loadReviews();

    } catch (error) {

      console.error(
        "Firebase authentication error:",
        error
      );

      reviewList.innerHTML = `

        <div class="error">
          Maaf, halaman review belum dapat
          terhubung ke server.
          <br><br>
          Silakan coba lagi nanti.
        </div>

      `;

    }

  }


  /* =========================
     LOAD APPROVED REVIEWS
     ========================= */

  async function loadReviews() {

    try {

      const reviewsRef =
        ref(db, "reviews");


      const reviewsQuery =
        query(
          reviewsRef,
          orderByChild("status"),
          equalTo("approved")
        );


      const snapshot =
        await get(reviewsQuery);


      allReviews = [];


      if (snapshot.exists()) {

        snapshot.forEach(
          (childSnapshot) => {

            allReviews.push({

              id:
                childSnapshot.key,

              ...childSnapshot.val()

            });

          }
        );

      }


      allReviews.sort(
        (a, b) =>
          (b.timestamp || 0) -
          (a.timestamp || 0)
      );


      renderReviews();


    } catch (error) {

      console.error(
        "Gagal memuat review:",
        error
      );

      reviewList.innerHTML = `

        <div class="error">

          Maaf, review belum dapat dimuat.

          <br><br>

          Silakan coba lagi nanti.

        </div>

      `;

    }

  }


  /* =========================
     RENDER
     ========================= */

  function renderReviews() {

    let reviews =
      allReviews;


    if (
      currentCategory !== "Semua"
    ) {

      reviews =
        allReviews.filter(
          review =>
            review.category ===
            currentCategory
        );

    }


    if (reviews.length === 0) {

      reviewList.innerHTML = `

        <div class="empty">

          💕 Belum ada review
          untuk kategori ini.

          <br><br>

          Kamu bisa menjadi
          yang pertama berbagi pengalaman.

        </div>

      `;

      return;

    }


    reviewList.innerHTML =
      reviews
        .map(createReviewCard)
        .join("");

  }


  /* =========================
     REVIEW CARD
     ========================= */

  function createReviewCard(review) {

    const title =
      escapeHTML(
        review.title ||
        "Review Produk"
      );


    const category =
      escapeHTML(
        review.category ||
        "Lainnya"
      );


    const nickname =
      escapeHTML(
        review.nickname ||
        "Anonim"
      );


    const text =
      escapeHTML(
        review.text ||
        ""
      );


    const preview =
      text.length > 160
        ? text.substring(0, 160) + "..."
        : text;


    const date =
      formatDate(review.timestamp);


    return `

      <a
        class="review-card"
        href="review-detail.html?id=${encodeURIComponent(review.id)}"
      >

        <div class="category">
          ⭐ ${category}
        </div>

        <h2 class="review-title">
          ${title}
        </h2>

        <p class="preview">
          ${preview}
        </p>

        <div class="meta">
          ✍️ ${nickname}
          ${date ? " • " + date : ""}
        </div>

        <div class="read-more">
          Baca Review →
        </div>

      </a>

    `;

  }


  /* =========================
     FILTER
     ========================= */

  document
    .querySelectorAll(".filter-button")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(".filter-button")
            .forEach(btn =>
              btn.classList.remove("active")
            );


          this.classList.add("active");


          currentCategory =
            this.dataset.category;


          renderReviews();

        }
      );

    });


  /* =========================
     DATE
     ========================= */

  function formatDate(timestamp) {

    if (!timestamp) {
      return "";
    }

    return new Date(timestamp)
      .toLocaleDateString(
        "id-ID",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

  }


  /* =========================
     SECURITY
     ========================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     START
     ========================= */

  start();

</script>

</body>
</html>
