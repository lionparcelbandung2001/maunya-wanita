    @media (max-width: 600px) {

  </style>

<body>

<header>
  <h1>💄 Tips Kecantikan</h1>
  <p>Tips makeup • outfit • merawat tubuh ❤️</p>
</header>


<div class="container">

  <a href="tipskecantikan.html" class="back">

  <div id="loading">

  <article

  <!-- =====================================

<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


  import {
    getAuth,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  import {
    getDatabase,
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCnhVGlnGKoqddyLvOgE7t4MGG926iQ8O0",

    authDomain:
      "ruang-cewek.firebaseapp.com",

    databaseURL:
      "https://ruang-cewek-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
      "ruang-cewek",

    storageBucket:
      "ruang-cewek.firebasestorage.app",

    messagingSenderId:
      "300030693884",

    appId:
      "1:300030693884:web:ec02ce2cf35646dbf3a279"

  };


  /* =========================================
     INITIALIZE
  ========================================= */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getDatabase(app);


  /* =========================================
     ELEMENTS
  ========================================= */

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const detail =
    document.getElementById("tipDetail");

  const commentsSection =
    document.getElementById("commentsSection");

  const categoryEl =
    document.getElementById("category");

  const titleEl =
    document.getElementById("title");

  const metaEl =
    document.getElementById("meta");

  const contentEl =
    document.getElementById("content");


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(value) {

    if (
      value === undefined ||
      value === null
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     CATEGORY LABEL
  ========================================= */

  function categoryLabel(category) {

    const labels = {

      "tips makeup":
        "💄 Tips Makeup",

      "tips memilih outfit":
        "👗 Tips Outfit",

      "tips merawat tubuh":
        "🧴 Tips Merawat Tubuh",

      /*
        Kompatibilitas data lama.
      */

      "tips bling2":
        "🧴 Tips Merawat Tubuh"

    };

    return labels[category] || category;

  }


  /* =========================================
     FORMAT DATE
  ========================================= */

  function formatDate(timestamp) {

    if (!timestamp) {
      return "";
    }

    const date =
      new Date(timestamp);

    if (
      isNaN(date.getTime())
    ) {
      return "";
    }

    return date.toLocaleDateString(
      "id-ID",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  }


  /* =========================================
     GET URL ID
  ========================================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const storyId =
    params.get("id");


  /* =========================================
     VALIDATE ID
  ========================================= */

  if (!storyId) {

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorBox.textContent =
      "ID tips kecantikan tidak ada.";

  }


  /* =========================================
     LOAD TIP
  ========================================= */

  async function loadTip() {

    try {

      /*
        Firebase Rules membutuhkan user
        yang sudah authenticated.
      */

      await signInAnonymously(auth);


      /*
        TIPS KECANTIKAN SEKARANG DISIMPAN
        DI NODE TERPISAH DARI CURHAT.

        /stories
          = Curhat

        /tipsKecantikan
          = Tips Kecantikan
      */

      const tipRef =
        ref(
          db,
          "tipsKecantikan/" + storyId
        );


      const snapshot =
        await get(tipRef);


      if (!snapshot.exists()) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
          "Tips kecantikan tidak ditemukan.";

        return;

      }


      const data =
        snapshot.val();


      /* =====================================
         HANYA APPROVED
      ====================================== */

      if (
        data.status !== "approved"
      ) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
          "Tips kecantikan ini belum di-approve.";

        return;

      }


      /* =====================================
         PASTIKAN KATEGORI ADALAH TIPS
      ====================================== */

      const category =
        String(
          data.category || ""
        )
        .trim()
        .toLowerCase();


      const validCategory =
        category === "tips makeup" ||
        category === "tips memilih outfit" ||
        category === "tips merawat tubuh" ||
        category === "tips bling2";


      if (!validCategory) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
          "Konten ini bukan tips kecantikan.";

        return;

      }


      /* =====================================
         DATA
      ====================================== */

      const rawTitle =
        String(
          data.title || "Tips Kecantikan"
        ).trim();


      const nickname =
        String(
          data.nickname || "Anonim"
        ).trim();


      const text =
        String(
          data.text || ""
        );


      const date =
        formatDate(data.timestamp);


      /* =====================================
         DISPLAY
      ====================================== */

      categoryEl.textContent =
        categoryLabel(category);


      titleEl.textContent =
        rawTitle;


      metaEl.textContent =
        "Oleh " +
        nickname +
        (date ? " · " + date : "");


      contentEl.textContent =
        text;


      /* =====================================
         SEO TITLE
      ====================================== */

      document.title =
        rawTitle +
        " | Tips Kecantikan - Ruang Cewek - CewekPedia";


      /* =====================================
         SEO DESCRIPTION
      ====================================== */

      const cleanDescription =
        text
          .replace(/\s+/g, " ")
          .trim()
          .substring(0, 155);


      const metaDescription =
        document.querySelector(
          'meta[name="description"]'
        );


      if (metaDescription) {

        metaDescription.setAttribute(
          "content",
          cleanDescription ||
          "Tips kecantikan wanita seputar makeup, outfit, dan merawat tubuh di Ruang Cewek - CewekPedia."
        );

      }


      /* =====================================
         CANONICAL
      ====================================== */

      const canonical =
        document.querySelector(
          'link[rel="canonical"]'
        );


      const pageUrl =
        window.location.href;


      if (canonical) {

        canonical.setAttribute(
          "href",
          pageUrl
        );

      }


      loading.style.display = "none";

      detail.style.display = "block";

      commentsSection.style.display = "block";


      /* =====================================
         ECHOTHREAD
      ====================================== */

      const echo =
        document.getElementById(
          "echothread"
        );


      echo.setAttribute(
        "data-api-key",
        "7nFTuMCqVbTn9YUzUJeB491qwNxk7slcZs0cRVbFuKI"
      );


      echo.setAttribute(
        "data-page-url",
        pageUrl
      );


      /*
        ID Firebase dijadikan identifier
        supaya komentar setiap tips terpisah.
      */

      echo.setAttribute(
        "data-identifier",
        storyId
      );


      echo.setAttribute(
        "data-page-title",
        rawTitle +
        " | Tips Kecantikan - Ruang Cewek - CewekPedia"
      );


      /*
        EchoThread dijalankan setelah data
        tips berhasil dimuat.
      */

      const echoScript =
        document.createElement("script");

      echoScript.src =
        "https://cdn.echothread.io/widget.js";

      echoScript.async = true;

      document.body.appendChild(
        echoScript
      );

    } catch (error) {

      console.error(
        "Firebase error:",
        error
      );

      loading.style.display = "none";

      errorBox.style.display = "block";

      errorBox.textContent =
        "Gagal memuat tips kecantikan: " +
        error.message;

    }

  }


  /* =========================================
     START
  ========================================= */

  if (storyId) {

    loadTip();

  }

</script>

</body>
