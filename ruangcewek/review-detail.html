<head>
  <meta charset="UTF-8">

  <meta name="robots" content="index, follow">

  <link rel="canonical"
        href="https://cewekpedia.com/ruangcewek/review-detail.html">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 800px;

    }

    article {
      background: white;

    }

    h1 {
      color: #d63384;
      line-height: 1.4;
    }

    .meta {
      color: #777;

      margin-bottom: 20px;
    }

    .content {
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .notice {
      background: #fff0f6;
      padding: 14px;
      border-radius: 10px;
      margin: 20px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #d63384;
      text-decoration: none;
      font-weight: bold;
    }

    .links {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-top: 25px;
      line-height: 1.8;
    }

    .links a {
      color: #d63384;
      text-decoration: none;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      padding: 20px 10px;
      color: #777;
      font-size: 13px;
      line-height: 1.7;
    }

    footer a {
      color: #d63384;
      text-decoration: none;
    }

    #comments {
      margin-top: 30px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <article>

    <div id="reviewContent" class="loading">
      Memuat review...
    </div>

    <div id="comments"></div>

  </article>

  <div class="links">
    <strong>Jelajahi Ruang Cewek:</strong><br>

    <a href="reviewproduk.html">Semua Review Produk</a><br>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getDatabase,
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDUMMY-REPLACE-WITH-YOUR-EXISTING-KEY",
    authDomain: "ruang-cewek.firebaseapp.com",
    databaseURL: "https://ruang-cewek-default-rtdb.firebaseio.com",
    projectId: "ruang-cewek",
    storageBucket: "ruang-cewek.firebasestorage.app",
    messagingSenderId: "YOUR_EXISTING_MESSAGING_SENDER_ID",
    appId: "YOUR_EXISTING_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const reviewContent = document.getElementById("reviewContent");

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function setPageSEO(review) {
    const title = review.title || "Review Produk";

    document.title =
      `${title} | Review Produk | Ruang Cewek - CewekPedia`;

    const description =
      (review.text || "Review produk dari Ruang Cewek CewekPedia.")
        .replace(/\s+/g, " ")
        .slice(0, 155);

    let descriptionMeta =
      document.querySelector('meta[name="description"]');

    if (descriptionMeta) {
      descriptionMeta.setAttribute("content", description);
    }

    const canonical =
      document.querySelector('link[rel="canonical"]');

    if (canonical) {
      canonical.setAttribute(
        "href",
        window.location.href.split("#")[0]
      );
    }
  }

  async function loadReview() {

    if (!id) {
      reviewContent.innerHTML = `
        <div class="loading">
          Review tidak ditemukan.
        </div>
      `;
      return;
    }

    try {

      const snapshot =
        await get(ref(db, "reviews/" + id));

      if (!snapshot.exists()) {
        reviewContent.innerHTML = `
          <div class="loading">
            Review tidak ditemukan.
          </div>
        `;
        return;
      }

      const review = snapshot.val();

      if (review.status !== "approved") {
        reviewContent.innerHTML = `
          <div class="loading">
            Review tidak tersedia.
          </div>
        `;
        return;
      }

      setPageSEO(review);

      const title =
        escapeHTML(review.title || "Review Produk");

      const category =
        escapeHTML(review.category || "Review");

      const nickname =
        escapeHTML(review.nickname || "Anonim");

      const text =
        escapeHTML(review.text || "");

      reviewContent.className = "";

      reviewContent.innerHTML = `
        <h1>${title}</h1>

        <div class="meta">
          ${category} · oleh ${nickname}
        </div>

        <div class="notice">
          <strong>Catatan:</strong>
          Review ini merupakan pengalaman atau pendapat pribadi
          penulis. Pengalaman setiap orang dapat berbeda.
        </div>

        <div class="content">
          ${text}
        </div>

        <a class="back" href="reviewproduk.html">
          ← Kembali ke semua review
        </a>
      `;

      /*
       * EchoThread tetap dapat digunakan di sini.
       * Gunakan konfigurasi EchoThread yang sudah ada
       * pada file lama agar tidak mengubah sistem komentar.
       */

    } catch (error) {

      console.error(error);

      reviewContent.innerHTML = `
        <div class="loading">
          Review belum dapat dimuat. Silakan coba lagi nanti.
        </div>
      `;
    }
  }

  loadReview();

</script>

</body>
</html>
