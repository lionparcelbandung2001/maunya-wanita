<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Curhat | Ruang Cewek</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#fff7fb;color:#3a2630}
.container{max-width:750px;margin:auto} .back{color:#d92f72;text-decoration:none;font-weight:bold}
.card{background:white;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,0.06)}
.card h3{margin:0 0 8px;color:#d92f72} .meta{color:#999;font-size:12px;margin-bottom:8px}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<a href="index.html" class="back">← Kembali</a>
<h2 style="color:#d92f72">💭 Daftar Curhat</h2>
<div id="list">⏳ Memuat...</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, query, orderByChild, equalTo, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCnhVGlnGKoqddyLvOgE7t4MGG926iQ8O0",
  authDomain: "ruang-cewek.firebaseapp.com",
  databaseURL: "https://ruang-cewek-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ruang-cewek", storageBucket: "ruang-cewek.firebasestorage.app",
  messagingSenderId: "300030693884", appId: "1:300030693884:web:ec02ce2cf35646dbf3a279"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

await signInAnonymously(auth);

const list = document.getElementById("list");
try {
  const q = query(ref(db, "stories"), orderByChild("status"), equalTo("approved"));
  const snap = await get(q);
  if(!snap.exists()){ list.innerHTML = "Belum ada curhat approved"; return; }
  let html = "";
  snap.forEach(child=>{
    const v = child.val();
    html += `<a href="curhat-detail.html?id=${child.key}"><div class="card"><h3>${v.title}</h3><div class="meta">${v.category} • ${v.nickname}</div><div>${v.text.substring(0,100)}...</div></div></a>`;
  });
  list.innerHTML = html;
} catch(e){ console.error(e); list.innerHTML = "Gagal memuat: " + e.message; }
</script>
</body>
</html>
