<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Curhat | Ruang Cewek</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#fff7fb;
    font-family:Arial,sans-serif;
    color:#3a2630;
}

body{
    padding:18px 12px 30px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

.back{
    display:inline-block;
    margin:5px 0 18px;
    color:#c52f68;
    text-decoration:none;
    font-weight:bold;
    font-size:14px;
}

.article{
    background:#ffffff;
    border:1px solid #f0dce6;
    border-radius:17px;
    padding:20px;
    box-shadow:0 2px 10px rgba(80,40,60,.06);
}

.category{
    display:inline-block;
    background:#fff0f5;
    color:#c52f68;
    border-radius:10px;
    padding:6px 9px;
    font-size:11px;
}

h1{
    margin:12px 0 8px;
    color:#d92f72;
    font-size:25px;
    line-height:1.4;
}

.meta{
    margin-bottom:20px;
    color:#927582;
    font-size:11px;
}

.story{
    color:#4d3943;
    font-size:13px;
    line-height:1.8;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.comments{
    margin-top:16px;
    background:#ffffff;
    border:1px solid #f0dce6;
    border-radius:17px;
    padding:18px;
    box-shadow:0 2px 10px rgba(80,40,60,.05);
}

.comments h2{
    margin:0 0 12px;
    color:#d92f72;
    font-size:18px;
}

.loading,
.error{
    text-align:center;
    padding:35px 15px;
    color:#765362;
    font-size:13px;
}

.error{
    background:#fff1f1;
    border:1px solid #e8b7b7;
    border-radius:14px;
    color:#9b3333;
}

footer{
    text-align:center;
    margin-top:22px;
    color:#987b87;
    font-size:10px;
}

</style>

</head>

<body>

<div class="container">

<a
    class="back"
    href="curhat.html"
>
    ← Kembali ke Curhat
</a>


<div id="content">

    <div class="loading">
        💭 Lagi membuka curhat...
    </div>

</div>


<footer>
    © CewekPedia — Ruang Cewek ❤️
</footer>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCnhVGlnGKoqddyLvOgE7t4MGG926iQ8O0",

    authDomain:
        "ruang-cewek.firebaseapp.com",

    databaseURL:
        "https://ruang-cewek-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "ruang-cewek",

    storageBucket:
        "ruang-cewek.firebasestorage.app",

    messagingSenderId:
        "300030693884",

    appId:
        "1:300030693884:web:ec02ce2cf35646dbf3a279"

};


const ECHOTHREAD_API_KEY =
    "7nFTuMCqVbTn9YUzUJeB491qwNxk7slcZs0cRVbFuKI";


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


const content =
    document.getElementById("content");


function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


function formatDate(timestamp){

    if(!timestamp){
        return "";
    }

    return new Date(timestamp).toLocaleDateString(
        "id-ID",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


async function loadCurhat(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    if(!id){

        content.innerHTML = `
            <div class="error">
                😔 Curhat tidak ditemukan.
            </div>
        `;

        return;

    }


    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "stories/" + id
                )
            );


        if(!snapshot.exists()){

            content.innerHTML = `
                <div class="error">
                    😔 Curhat tidak ditemukan.
                </div>
            `;

            return;

        }


        const data =
            snapshot.val();


        if(data.status !== "approved"){

            content.innerHTML = `
                <div class="error">
                    😔 Curhat ini belum tersedia.
                </div>
            `;

            return;

        }


        const title =
            data.title || "Curhat";


        document.title =
            title +
            " | Ruang Cewek";


        content.innerHTML = `

            <article class="article">

                <div class="category">
                    💭 ${escapeHTML(data.category)}
                </div>

                <h1>
                    ${escapeHTML(title)}
                </h1>

                <div class="meta">
                    Oleh ${escapeHTML(data.nickname || "Anonim")}
                    • ${formatDate(data.timestamp)}
                </div>

                <div class="story">
                    ${escapeHTML(data.text)}
                </div>

            </article>


            <section class="comments">

                <h2>
                    💬 Komentar
                </h2>

                <div
                    id="echothread"
                    data-api-key="${ECHOTHREAD_API_KEY}"
                    data-page-url=""
                    data-identifier=""
                    data-page-title=""
                >
                </div>

            </section>

        `;


        const echo =
            document.getElementById(
                "echothread"
            );


        const pageUrl =
            window.location.origin +
            window.location.pathname +
            "?id=" +
            encodeURIComponent(id);


        echo.setAttribute(
            "data-page-url",
            pageUrl
        );


        echo.setAttribute(
            "data-identifier",
            id
        );


        echo.setAttribute(
            "data-page-title",
            title
        );


        const script =
            document.createElement("script");


        script.src =
            "https://cdn.echothread.io/widget.js";


        script.async =
            true;


        document.body.appendChild(
            script
        );


    }catch(error){

        console.error(error);


        content.innerHTML = `
            <div class="error">
                😔 Curhat belum bisa dimuat.<br>
                Silakan coba lagi nanti.
            </div>
        `;

    }

}


loadCurhat();

</script>

</body>
</html>
